<!doctype html>
<html lang="zh-CN" data-theme="afterglow">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fdf3ee">
<title>陈天 · Tian Chen</title>
<meta name="description" content="陈天的个人作品集：教育背景、实习经历与项目经历。AI 应用与 Agent、数据产品、独立游戏。">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=2026111101">
<script src="content.js?v=2026111101" defer></script>
<script src="app.js?v=2026111101" defer></script>
</head>
<body>
<header class="top">
  <a href="#home" class="logo"><span class="mark">陈</span><span>Tian Chen<small>portfolio · 2026</small></span></a>
  <nav aria-label="主导航">
    <a href="#education">教育背景</a>
    <a href="#experience">实习经历</a>
    <a href="#projects">项目经历</a>
    <a href="#contact">联系方式</a>
  </nav>
</header>

<main>
  <!-- HOME -->
  <section id="home" class="hero">
    <div class="sky" aria-hidden="true"><img src="assets/art/afterglow-hero.webp" alt=""></div>
    <div class="motes" aria-hidden="true"></div>
    <div class="hero-text">
      <p class="hello">Hello, nice to meet you <span class="spark">✦</span></p>
      <h1><span class="h-cn" data-bind="name"></span><span class="h-en" data-bind="nameEn"></span></h1>
      <p class="fields"></p>
      <p class="line" data-bind="line"></p>
      <div class="cta">
        <a class="btn solid" href="#projects">看看我的项目 <i>→</i></a>
        <a class="btn" data-href="email">发邮件</a>
        <a class="btn" data-href="github" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </div>
      <dl class="facts">
        <div><dt>Email</dt><dd><a data-href="email" data-bind="email"></a></dd></div>
        <div><dt>Language</dt><dd data-bind="languages"></dd></div>
        <div class="wide"><dt>Toolkit</dt><dd class="skills"></dd></div>
      </dl>
    </div>
  </section>

  <!-- EDUCATION -->
  <section id="education" class="sec">
    <header class="sec-head reveal"><img class="sec-ico" data-ico="0" alt=""><div><span class="sec-en">Education</span><h2>教育背景</h2></div></header>
    <div class="edu"></div>
  </section>

  <!-- EXPERIENCE -->
  <section id="experience" class="sec">
    <header class="sec-head reveal"><img class="sec-ico" data-ico="1" alt=""><div><span class="sec-en">Experience</span><h2>实习经历</h2></div></header>
    <div class="exp"></div>
  </section>

  <!-- PROJECTS -->
  <section id="projects" class="sec">
    <header class="sec-head reveal"><img class="sec-ico" data-ico="2" alt=""><div><span class="sec-en">Projects</span><h2>项目经历</h2></div>
      <div class="filters" role="group" aria-label="按类型筛选"></div></header>
    <div class="bento"></div>
    <p class="more-repos"></p>
  </section>

  <!-- CONTACT -->
  <section id="contact" class="sec contact">
    <header class="sec-head reveal"><img class="sec-ico" data-ico="3" alt=""><div><span class="sec-en">Contact</span><h2>联系方式</h2></div></header>
    <div class="contact-grid">
      <a class="c-card main" data-href="email"><small>Email</small><b data-bind="email"></b><i>→</i></a>
      <a class="c-card" data-href="github" target="_blank" rel="noopener noreferrer"><small>GitHub</small><b>@XinShu394</b><i>↗</i></a>
      <a class="c-card" data-href="bilibili" target="_blank" rel="noopener noreferrer"><small>Bilibili</small><b>BOGAME 演示</b><i>↗</i></a>
    </div>
    <footer><span>© 2026 Tian Chen</span><span>logo 与商标归各自权利人所有</span><a href="#home">回到顶部 ↑</a></footer>
  </section>
</main>

<!-- 背景音乐 -->
<div class="player" aria-live="polite">
  <button class="p-btn" type="button" aria-label="播放背景音乐" aria-pressed="false"><span class="p-icon"></span></button>
  <div class="p-info"><b class="p-title"></b><small class="p-note"></small></div>
  <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  <audio preload="none" loop></audio>
</div>

<dialog id="detail"><button class="x" aria-label="关闭">✕</button><div class="d-body"></div></dialog>
</body>
</html>
